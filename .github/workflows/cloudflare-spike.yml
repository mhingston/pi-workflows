name: Cloudflare provider spike
on:
  pull_request:
    paths:
      - "spikes/cloudflare/**"
      - ".github/workflows/cloudflare-spike.yml"
  push:
    branches: [main]
    paths:
      - "spikes/cloudflare/**"
      - ".github/workflows/cloudflare-spike.yml"
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
      - run: node --test spikes/cloudflare/code-executor.test.mjs

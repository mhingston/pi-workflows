name: Lossless visual editor

on:
  pull_request:
    paths:
      - "src/editor.ts"
      - "src/canvas.ts"
      - "src/editor-server.ts"
      - "ui/**"
      - "fixtures/**"
      - "tests/editor.test.ts"
      - "src/artifact.ts"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/editor.yml"
      - "docs/visual-editor.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Artifact contracts
        run: npm run test:artifact
      - name: Editor round trip and local viewer
        run: npm run test:editor
